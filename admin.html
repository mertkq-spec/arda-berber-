<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli | Arda Yılmaz</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0b0b0b;
            --card: #161616;
            --text: #f0f0f0;
            --muted: #aaa;
            --border: #222;
            --header: #121212;
            --accent: #d4af37;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #3498db;
        }
        [data-theme="light"] {
            --bg: #f4f4f4;
            --card: #ffffff;
            --text: #222222;
            --muted: #666666;
            --border: #dddddd;
            --header: #ffffff;
            --accent: #b89728;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }

        .login-box { max-width: 400px; margin: 100px auto; padding: 40px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .login-box h2 { margin-bottom: 30px; color: var(--accent); font-size: 28px; }
        .login-box input { width: 100%; padding: 14px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 15px; }
        .btn { background: var(--accent); color: #0b0b0b; padding: 14px 36px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; display: inline-block; font-size: 15px; width: 100%; }
        .btn:hover { background: #f3c653; }

        .admin-container { display: none; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { color: var(--accent); font-size: 28px; }
        .btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-outline:hover { background: var(--accent); color: #0b0b0b; }
        .theme-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 10px; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { font-size: 36px; color: var(--accent); margin-bottom: 5px; }
        .stat-card p { color: var(--muted); font-size: 14px; }

        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar select, .filter-bar input { padding: 10px 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; }

        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--header); color: var(--accent); font-weight: 600; font-size: 14px; }
        td { color: var(--text); font-size: 14px; }
        tr:hover { background: rgba(212, 175, 55, 0.05); }
        .durum-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .durum-bekliyor { background: rgba(243, 156, 18, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .durum-onaylandi { background: rgba(46, 204, 113, 0.15); color: var(--success); border: 1px solid var(--success); }
        .durum-tamamlandi { background: rgba(52, 152, 219, 0.15); color: var(--info); border: 1px solid var(--info); }
        .durum-iptal { background: rgba(231, 76, 60, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .btn-kucuk { padding: 6px 12px; font-size: 12px; margin-right: 5px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
        .btn-sil { background: var(--danger); color: #fff; }
        .btn-duzenle { background: var(--info); color: #fff; }
        .bos-mesaj { text-align: center; padding: 50px; color: var(--muted); }

        @media (max-width: 768px) {
            th, td { padding: 10px; font-size: 12px; }
            .btn-kucuk { padding: 4px 8px; font-size: 11px; margin: 2px; }
            .admin-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="login-box" id="girisEkrani">
    <h2>🔒 Admin Girişi</h2>
    <input type="text" id="kullaniciAdi" placeholder="Kullanıcı adı">
    <input type="password" id="sifre" placeholder="Şifre">
    <button class="btn" onclick="girisYap()">Giriş Yap</button>
    <p style="margin-top:15px;color:var(--muted);font-size:13px">
        Varsayılan: admin / Arda2026!
    </p>
</div>

<div class="admin-container" id="adminPaneli">
    <div class="admin-header">
        <h1>📊 Randevu Yönetim Paneli</h1>
        <div>
            <button class="theme-btn" id="temaBtn" onclick="temaDegistir()">🌙</button>
            <button class="btn-outline" onclick="cikisYap()">Çıkış Yap</button>
            <a href="index.html"><button class="btn" style="margin-left:10px;width:auto">Siteye Git</button></a>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><h3 id="toplamRandevu">0</h3><p>Toplam Randevu</p></div>
        <div class="stat-card"><h3 id="bugunRandevu">0</h3><p>Bugünkü Randevular</p></div>
        <div class="stat-card"><h3 id="bekleyenRandevu">0</h3><p>Bekleyen Randevular</p></div>
        <div class="stat-card"><h3 id="toplamGelir">0 TL</h3><p>Toplam Gelir</p></div>
    </div>

    <div class="filter-bar">
        <select id="durumFiltre" onchange="randevulariGoster()">
            <option value="hepsi">Tüm Randevular</option>
            <option value="Bekliyor">Bekliyor</option>
            <option value="Onaylandı">Onaylandı</option>
            <option value="Tamamlandı">Tamamlandı</option>
            <option value="İptal">İptal</option>
        </select>
        <input type="text" id="arama" placeholder="İsim veya telefon ara..." onkeyup="randevulariGoster()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ad Soyad</th>
                    <th>Telefon</th>
                    <th>Hizmet</th>
                    <th>Tarih</th>
                    <th>Saat</th>
                    <th>Durum</th>
                    <th>İşlemler</th>
                </tr>
            </thead>
            <tbody id="randevuTablo"></tbody>
        </table>
        <div class="bos-mesaj" id="bosMesaj" style="display:none">Henüz randevu bulunmuyor.</div>
    </div>
</div>

<script>
const ADMIN_KULLANICI = "admin";
const ADMIN_SIFRE = "Arda2026!";

document.addEventListener('DOMContentLoaded', function() {
    const kayitliTema = localStorage.getItem('tema');
    if (kayitliTema === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('temaBtn').innerText = '☀️';
    }
    if (localStorage.getItem('adminGiris') === 'evet') paneliGoster();
});

function girisYap() {
    const ka = document.getElementById('kullaniciAdi').value;
    const sf = document.getElementById('sifre').value;
    if (ka === ADMIN_KULLANICI && sf === ADMIN_SIFRE) {
        localStorage.setItem('adminGiris', 'evet');
        paneliGoster();
    } else {
        alert('❌ Kullanıcı adı veya şifre hatalı!');
    }
}

function cikisYap() {
    localStorage.removeItem('adminGiris');
    location.reload();
}

function temaDegistir() {
    const html = document.documentElement;
    const btn = document.getElementById('temaBtn');
    if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        localStorage.setItem('tema', 'dark');
        btn.innerText = '🌙';
    } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('tema', 'light');
        btn.innerText = '☀️';
    }
}

function paneliGoster() {
    document.getElementById('girisEkrani').style.display = 'none';
    document.getElementById('adminPaneli').style.display = 'block';
    istatistikleriGuncelle();
    randevulariGoster();
}

function istatistikleriGuncelle() {
    const randevular = JSON.parse(localStorage.getItem('randevular')) || [];
    const bugun = new Date().toISOString().split('T')[0];
    
    document.getElementById('toplamRandevu').innerText = randevular.length;
    document.getElementById('bugunRandevu').innerText = randevular.filter(r => r.tarih === bugun).length;
    document.getElementById('bekleyenRandevu').innerText = randevular.filter(r => r.durum === 'Bekliyor').length;
    
    let gelir = 0;
    randevular.forEach(r => {
        if (r.durum === 'Tamamlandı') {
            const fiyat = parseInt(r.hizmet.match(/\d+/)[0]);
            gelir += fiyat;
        }
    });
    document.getElementById('toplamGelir').innerText = gelir + ' TL';
}

function randevulariGoster() {
    let randevular = JSON.parse(localStorage.getItem('randevular')) || [];
    const filtre = document.getElementById('durumFiltre').value;
    const arama = document.getElementById('arama').value.toLowerCase();
    
    if (filtre !== 'hepsi') randevular = randevular.filter(r => r.durum === filtre);
    if (arama) randevular = randevular.filter(r => r.ad.toLowerCase().includes(arama) || r.tel.includes(arama));
    
    randevular.sort((a, b) => new Date(b.tarih + 'T' + b.saat) - new Date(a.tarih + 'T' + a.saat));
    
    const tablo = document.getElementById('randevuTablo');
    const bosMesaj = document.getElementById('bosMesaj');
    
    if (randevular.length === 0) {
        tablo.innerHTML = '';
        bosMesaj.style.display = 'block';
        return;
    }
    
    bosMesaj.style.display = 'none';
    
    tablo.innerHTML = randevular.map(r => {
        let durumClass = '';
        if (r.durum === 'Bekliyor') durumClass = 'durum-bekliyor';
        else if (r.durum === 'Onaylandı') durumClass = 'durum-onaylandi';
        else if (r.durum === 'Tamamlandı') durumClass = 'durum-tamamlandi';
        else if (r.durum === 'İptal') durumClass = 'durum-iptal';
        
        return `
        <tr>
            <td>#${r.id.toString().slice(-4)}</td>
            <td>${r.ad}</td>
            <td>${r.tel}</td>
            <td>${r.hizmet}</td>
            <td>${r.tarih}</td>
            <td>${r.saat}</td>
            <td><span class="durum-badge ${durumClass}">${r.durum}</span></td>
            <td>
                <button class="btn-kucuk btn-duzenle" onclick="durumDegistir(${r.id})">Durum</button>
                <button class="btn-kucuk btn-sil" onclick="sil(${r.id})">Sil</button>
            </td>
        </tr>`;
    }).join('');
}

function durumDegistir(id) {
    let randevular = JSON.parse(localStorage.getItem('randevular')) || [];
    const r = randevular.find(x => x.id === id);
    if (!r) return;
    
    const durumlar = ['Bekliyor', 'Onaylandı', 'Tamamlandı', 'İptal'];
    const simdikiIndex = durumlar.indexOf(r.durum);
    r.durum = durumlar[(simdikiIndex + 1) % durumlar.length];
    
    localStorage.setItem('randevular', JSON.stringify(randevular));
    istatistikleriGuncelle();
    randevulariGoster();
}

function sil(id) {
    if (!confirm('Bu randevuyu silmek istediğine emin misin?')) return;
    let randevular = JSON.parse(localStorage.getItem('randevular')) || [];
    randevular = randevular.filter(r => r.id !== id);
    localStorage.setItem('randevular', JSON.stringify(randevular));
    istatistikleriGuncelle();
    randevulariGoster();
}
</script>

</body>
</html>
